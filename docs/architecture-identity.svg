<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="445" viewBox="0 0 1100 445" role="img" aria-labelledby="title desc"><title id="title">Number game round transitions</title><desc id="desc">Validated guesses change the playing state; wins and losses lock the round until reset. Invalid and repeated guesses do not cost points.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#edc7a2"/></marker></defs><rect width="1100" height="445" fill="#7d2920"/><g font-family="Tahoma, sans-serif" fill="#fff5dd" color="#fff5dd"><text x="35" y="50" font-size="30" fill="#fff5dd" font-weight="bold" text-anchor="start">ROUND RULES</text><text x="35" y="82" font-size="18" fill="#edc7a2" font-weight="normal" text-anchor="start">Guess My Number</text><rect x="35" y="130" width="220" height="105" fill="#682219" stroke="#edc7a2" stroke-dasharray=""/><text x="53" y="166" font-size="20" fill="#fff5dd" font-weight="bold" text-anchor="start">VALIDATE INPUT</text><text x="53" y="196" font-size="15" fill="#fff5dd" font-weight="normal" text-anchor="start">Whole number: 1 to 20</text><text x="53" y="220" font-size="15" fill="#fff5dd" font-weight="normal" text-anchor="start">Ignore repeated guesses</text><circle cx="490" cy="183" r="72" fill="#fff5dd"/><text x="490" y="177" font-size="25" fill="#682219" font-weight="bold" text-anchor="middle">PLAYING</text><text x="490" y="205" font-size="14" fill="#682219" font-weight="normal" text-anchor="middle">10 points initially</text><rect x="800" y="105" width="240" height="80" fill="#fff5dd" stroke="none" stroke-dasharray=""/><text x="920" y="139" font-size="25" fill="#682219" font-weight="bold" text-anchor="middle">WON</text><text x="920" y="165" font-size="15" fill="#682219" font-weight="normal" text-anchor="middle">Lock round / update best</text><rect x="800" y="260" width="240" height="80" fill="#682219" stroke="#edc7a2" stroke-dasharray=""/><text x="920" y="293" font-size="25" fill="#fff5dd" font-weight="bold" text-anchor="middle">LOST</text><text x="920" y="320" font-size="15" fill="#fff5dd" font-weight="normal" text-anchor="middle">Lock round at zero</text><path d="M255 182 H416" fill="none" stroke="#edc7a2" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="165" font-size="14" fill="#fff5dd" font-weight="normal" text-anchor="start">new valid guess</text><path d="M560 165 H690 V144 H798" fill="none" stroke="#edc7a2" stroke-width="2" marker-end="url(#arrow)"/><text x="620" y="130" font-size="15" fill="#fff5dd" font-weight="normal" text-anchor="start">correct</text><path d="M540 236 V300 H798" fill="none" stroke="#edc7a2" stroke-width="2" marker-end="url(#arrow)"/><text x="570" y="280" font-size="15" fill="#fff5dd" font-weight="normal" text-anchor="start">wrong / last point</text><path d="M490 111 V92 H365 V183 H416" fill="none" stroke="#edc7a2" stroke-width="2" marker-end="url(#arrow)"/><text x="265" y="74" font-size="14" fill="#fff5dd" font-weight="normal" text-anchor="start">wrong guess: deduct one, then continue</text><path d="M920 340 V382 H490 V257" fill="none" stroke="#edc7a2" stroke-width="2" marker-end="url(#arrow)"/><path d="M1040 145 H1060 V382 H920" fill="none" stroke="#edc7a2" stroke-width="2" marker-end="url(#arrow)"/><text x="635" y="405" font-size="15" fill="#fff5dd" font-weight="normal" text-anchor="start">NEW ROUND: reset points, keep session best</text></g></svg>
